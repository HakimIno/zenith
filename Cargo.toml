[workspace]
resolver = "2"
members = [
    "zenith-cli",
    "zenith-core",
    "zenith-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Zenith Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zenith-cdc/zenith"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full", "parking_lot"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
async-trait = "0.1"

# PostgreSQL
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
postgres-protocol = "0.6"
postgres-types = { version = "0.2", features = ["with-chrono-0_4", "with-serde_json-1"] }

# HTTP client for ClickHouse
reqwest = { version = "0.12", features = ["json", "gzip", "stream"] }
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http-body-util = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
bytes = "1.8"
byteorder = "1.5"

# Concurrent data structures
dashmap = "6.1"
crossbeam = { version = "0.8", features = ["crossbeam-channel"] }
parking_lot = "0.12"

# Storage
sled = "0.34"

# Metrics
prometheus = { version = "0.13", features = ["process"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
config = "0.14"
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"

# Utils
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
once_cell = "1.20"
pin-project-lite = "0.2"

# Compression
flate2 = "1.0"

# Crypto
md5 = "0.7"

# Testing
criterion = { version = "0.5", features = ["async_tokio"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = 3

[profile.bench]
lto = "thin"
codegen-units = 1


